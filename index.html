 <div class="g4">${cd('طلبات الفترة',OP.length,dl(OP.length,OPp.length),"go2('orders')")}${cd('المبيعات المعترف بها',sales,dl(sales,salesP),"go2('orders')")}${cd('المحصّل على طلبات الفترة',paidOP,'',"go2('orders')")}${cd('غير محصّل',unpaidAmt,`<small>${unpaid.length} طلب</small>`,"go2('orders')")}${cd('قيمة المخزون بالتكلفة',sum(P,p=>p.q*tc(p)),`<small>${P.reduce((a,p)=>a+p.q,0)} قطعة</small>`,"go2('products')")}${cd('أصناف منخفضة',low.length,'',"go2('products')")}${fin?cd('صافي الربح (تقديري)',r.net,dl(r.net,rP.net),"go2('fin')")+cd('رصيد الخزينة',r.bal,'',"go2('fin')")+cd('إشعارات إيداع معلقة',pendN,'',"go2('notices')"):''}</div>
 <div class="box"><h3>المبيعات اليومية</h3><div class="bars" style="height:150px">${days.map(([d,v])=>`<div title="${d}: ${N(v)} ج.م"><i style="height:${v/mx*100}%"></i><s>${d}</s></div>`).join('')}</div></div>
 <div class="g2"><div class="box"><h3>الطلبات حسب الحالة (اضغط للتفاصيل)</h3>${stc.map(([s,c])=>`<div class="frow" onclick="goSt('${s}')"><span>${s}</span><div class="fb"><i style="width:${c/smx*100}%"></i></div><b>${c}</b></div>`).join('')}</div>
 <div class="box"><h3>الأكثر مبيعًا</h3>${top.map(([k,v])=>`<div class="frow"><span>${esc(k)}</span><span>${v.q} قطعة · ${N(v.v)}</span></div>`).join('')||'لا توجد مبيعات في الفترة'}</div></div>
 <div class="g2"><div class="box"><h3>غير محصّل (أعلى 6، اضغط للطلب)</h3>${unpaid.sort((a,b)=>rest(b)-rest(a)).slice(0,6).map(o=>`<div class="frow" onclick="oform('${o.id}')"><span>#${o.no} ${esc(o.name)}</span><b class="no">${N(rest(o))}</b></div>`).join('')||'<span class="ok">كل الطلبات محصّلة ✓</span>'}</div>
 <div class="box"><h3>أصناف تحتاج تعبئة</h3>${low.slice(0,6).map(p=>`<div class="frow" onclick="go2('products')"><span>${esc(p.n+' '+p.c+' '+p.s)}</span><b class="no">${p.q}</b></div>`).join('')||'<span class="ok">المخزون تمام ✓</span>'}</div></div>
 <div class="box"><h3>أداء شركات الشحن</h3>${tb(['الشركة','الطلبات','تسليم','فشل','مرتجع','نسبة التسليم'],Object.entries(cm).map(([k,v])=>[esc(k),v.n,v.d,v.f,v.r,v.n?Math.round(v.d/v.n*100)+'%':'—']))}</div>
 ${can('admin')&&A.length?`<div class="box"><h3>آخر نشاط</h3>${A.slice(0,6).map(a=>`<div class="frow"><span>${D(a.t)} · ${esc(a.u)}</span><span>${esc(a.act)}</span></div>`).join('')}</div>`:''}
 <div class="box"><h3>تنبيهات</h3>${al.map(x=>`<div>• ${x}</div>`).join('')||'لا توجد تنبيهات'}</div>
 <small>المبيعات المعترف بها = طلبات «تم التسليم» بتاريخ التسليم داخل الفترة. المحصّل = المدفوع في الطلبات داخل الفترة.</small>`};

V.notices=()=>{const L=(X.nt||[]).slice(0,200),ca=can('admin','accountant');return `<h2>إشعارات الحسابات</h2><p><small>بتتولد تلقائيًا لما طلب يتسلّم. أكد الإيداع لما الفلوس تدخل، أو علّم "مؤجل" لو لسه ما اتحولتش.</small></p>`+
 tb(['التاريخ','الطلب','العميل','المتبقي حاليًا','الحالة','بواسطة',''],L.map(n=>{const o=O.find(x=>x.id==n.oid),rem=o?rest(o):0,open=n.st=='معلق'||n.st=='مؤجل';return [D(n.t),'#'+n.no,esc(n.name),N(rem),n.st,esc(n.by),open&&ca?`<button class="b" onclick="nPay('${n.id}')">تأكيد الإيداع</button> <button class="b s" onclick="nLater('${n.id}')">مؤجل</button>`:(n.doneBy?esc(n.doneBy):'')]}))};
function nPay(nid){const n=(X.nt||[]).find(x=>x.id==nid),o=O.find(x=>x.id==n.oid),rem=o?rest(o):0;window.curN=nid;modal(`<h3>تأكيد إيداع: طلب #${n.no}</h3><p>المتبقي على الطلب: <b>${N(rem)}</b></p><div class="g"><div><label>المبلغ المودع</label><input id="npa" type="number" min="1" max="${rem}" value="${rem}"></div><div><label>طريقة الإيداع</label><input id="npm" placeholder="كاش / محفظة / إنستاباي"></div></div><p><button class="b" onclick="nPay2()">تسجيل</button> <button class="b s" onclick="closeM()">إلغاء</button></p>`)}
async function nPay2(){if(busy)return;const a=+val('npa'),m=val('npm').trim();if(!(a>0)||!m)return toast('أدخل المبلغ وطريقة الإيداع');busy=1;const nid=window.curN;
 try{await fs.runTransaction(async t=>{const nr=fs.doc('notices/'+nid),nd=(await t.get(nr)).data();if(nd.st=='تم الإيداع')throw Error('تم تأكيده قبل كده');const orf=fs.doc('orders/'+nd.oid),o=(await t.get(orf)).data();if(a>rest(o))throw Error('المبلغ أكبر من المتبقي ('+N(rest(o))+')');const k=o.ncol||0;
  t.update(orf,{paid:(+o.paid||0)+a,ncol:k+1,ver:o.ver+1,upd:TS(),payBy:{n:me.name,t:Date.now()},hist:[...o.hist,{t:Date.now(),u:me.name,f:o.st,to:o.st,r:'تأكيد إيداع '+a+' ('+m+')',ch:['paid']}]});
  t.set(fs.doc('money/nt_'+nid+'_'+k),{t:Date.now(),k:'in',cat:'تحصيل طلب',amt:a,method:m,ref:nd.oid,no:o.no,note:'',u:me.name,void:false});
  t.update(nr,{st:'تم الإيداع',doneBy:me.name,doneT:Date.now()})});aud('money','تأكيد إيداع طلب #'+nid);closeM();toast('تم تأكيد الإيداع')}catch(e){toast(e.message||e.code)}busy=0}
async function nLater(nid){try{await fs.doc('notices/'+nid).update({st:'مؤجل',doneBy:me.name,doneT:Date.now()});aud('money','تأجيل إشعار '+nid);toast('تم التأجيل')}catch(e){toast(e.code)}}

V.users=()=>`<h3>المستخدمون والصلاحيات</h3><p><small>الدور يحدد الصلاحيات الفعلية على البيانات. الصفحات تحدد اللي بيشوفه المستخدم في القائمة. المدير العام يشوف كل شيء، ومساعد المدير ما يقدرش يدير المستخدمين أو الإعدادات.</small></p><button class="b" onclick="uform()">+ مستخدم</button>`+
 tb(['الاسم','الإيميل','الدور','الصفحات','الحالة',''],U.map(u=>[esc(u.name),esc(u.email),RL[u.role]||u.role,u.role=='admin'?'الكل':pagesOf(u).length+' صفحة',u.active?'مفعّل':'معطّل',`<button class="b s" onclick="uform('${u.id}')">تعديل</button>`]));
function uPreset(r){const pg=PRE[r]||[];document.querySelectorAll('.pgc').forEach(c=>c.checked=pg.includes(c.value))}
function uform(id){const u=id?U.find(x=>x.id==id):null,own=!!u&&u.id==me.uid,pg=u?pagesOf(u):PRE.orders,
 chk=k=>`<label style="display:inline-block;margin:4px 10px 4px 0"><input type="checkbox" class="pgc" value="${k}" ${pg.includes(k)?'checked':''}> ${PG[k]}</label>`;
 modal(`<h3>${u?'تعديل: '+esc(u.name):'مستخدم جديد'}</h3><div class="g"><div><label>الاسم</label><input id="un" value="${esc(u?u.name:'')}"></div>${u?'':`<div><label>الإيميل</label><input id="ue" type="email"></div><div><label>كلمة سر مؤقتة (6+)</label><input id="up" type="password"></div>`}<div><label>الدور</label><select id="ur" onchange="uPreset(this.value)" ${own?'disabled':''}>${Object.entries(RL).map(([k,v])=>`<option value="${k}" ${(u?u.role:'orders')==k?'selected':''}>${v}</option>`).join('')}</select></div><div><label>مفعّل</label><input type="checkbox" id="ua" ${!u||u.active?'checked':''} ${own?'disabled':''}></div></div>
 <h4>الصفحات المسموحة</h4><div>${Object.keys(PG).filter(k=>k!='set').map(chk).join('')}</div><p><small>اختيار الدور بيعبي الصفحات تلقائي، وتقدر تعدل بعدها. مساعد المدير ما يقدرش يشوف الإعدادات.</small></p>
 <p><button class="b" onclick="usave('${id||''}')">حفظ</button> <button class="b s" onclick="closeM()">إغلاق</button>${u?` <button class="b s" onclick="uReset('${esc(u.email)}')">إرسال رابط تغيير كلمة السر</button>`:''}</p>`)}
async function usave(id){const n=val('un').trim(),r=val('ur'),a=document.getElementById('ua').checked,pg=[...document.querySelectorAll('.pgc:checked')].map(x=>x.value).filter(k=>k!='set'),pages=r=='admin'?Object.keys(PG):pg;
 if(!n)return toast('الاسم مطلوب');
 if(id){try{await fs.doc('users/'+id).update({name:n,role:r,pages,active:a});aud('user','تعديل مستخدم '+n);closeM();toast('تم الحفظ')}catch(e){toast(e.code)}return}
 const e=val('ue').trim(),p=val('up');if(!e||p.length<6)return toast('الإيميل وكلمة سر 6 حروف على الأقل مطلوبين');let app2;
 try{app2=firebase.initializeApp(CFG,'s'+Date.now());const c=await app2.auth().createUserWithEmailAndPassword(e,p);await fs.doc('users/'+c.user.uid).set({name:n,email:e,role:r,pages,active:a});await app2.auth().signOut();aud('user','إنشاء مستخدم '+e);closeM();toast('تم إنشاء المستخدم')}catch(x){toast('تعذر الإنشاء: '+x.code)}finally{if(app2)app2.delete()}}
function uReset(email){firebase.auth().sendPasswordResetEmail(email).then(()=>toast('أُرسل الرابط للإيميل')).catch(e=>toast(e.code))}

V.set=()=>{if(me.role!='admin')return '<p>هذه الصفحة للمدير العام فقط.</p>';const T=[['cfg','الإعدادات والنسخ'],['users','المستخدمون'],['audit','سجل النشاط'],['test','الاختبارات']],t=F.stab||'cfg';
 return `<h2>الإعدادات</h2><div class="row">${T.map(([k,l])=>`<button class="chip ${t==k?'on':''}" onclick="F.stab='${k}';draw()">${l}</button>`).join('')}</div>`+({cfg:setCfg,users:V.users,audit:V.audit,test:V.test})[t]()};
V.audit=()=>`<h2>سجل النشاط</h2>`+tb(['الوقت','المستخدم','النوع','الإجراء'],A.map(a=>[D(a.t),esc(a.u),a.type,esc(a.act)]));
V.test=()=>{const r=[],ok=(n,c)=>r.push([n,c?'<b class="ok">نجح</b>':'<b class="no">فشل</b>']),ps={a:{n:'x',q:5}},mk=(q,st,sk)=>({st,sk,items:[{v:'a',q,p:200}],disc:0,fee:0,paid:0});
 let p=plan(null,mk(2,'مؤكد'),ps);ok('التأكيد يخصم 2',p.d.a==-2&&p.sk);const o1=mk(2,'مؤكد',true);p=plan(o1,mk(3,'مؤكد'),ps);ok('رفع الكمية 2→3 يخصم 1 فقط',p.d.a==-1);
 p=plan(o1,mk(2,'مشحون'),ps);ok('مؤكد→مشحون بلا خصم مزدوج',!p.d.a);p=plan(o1,mk(2,'ملغي'),ps);ok('الإلغاء يعيد 2',p.d.a==2&&!p.sk);
 p=plan(mk(2,'تم التسليم',true),mk(2,'مرتجع'),ps);ok('المرتجع لا يعيد المخزون قبل الفحص',!p.d.a&&p.sk);ok('منع البيع بأكثر من المتاح',!!plan(null,mk(9,'مؤكد'),ps).err);
 const o={items:[{q:2,p:200},{q:1,p:100}],disc:50,fee:30,paid:100};ok('الإجمالي = 500−50+30 = 480',total(o)==480);ok('المتبقي = 480−100 = 380',rest(o)==380);
 return `<h2>اختبار الحسابات (دوال نقية فقط)</h2><p>لا يختبر هذا الاتصال بـ Firebase أو القواعد؛ دي تُختبر يدويًا (راجع قائمة التسليم).</p>`+tb(['الاختبار','النتيجة'],r)};
draw();
</script></body></html>
