 busy=1;$('#osb').disabled=true;try{const no=await saveOrder(n,cur.exp,why);window.dupOk=0;closeM();toast('تم الحفظ — طلب #'+no)}catch(e){toast(e.message||e.code)}busy=0;const b=$('#osb');if(b)b.disabled=false}
V.products=()=>`<h2>المنتجات والمخزون</h2>${can('admin','stock')?'<button class="b" onclick="pform()">+ منتج / مقاس</button>':''}`+tb(['المنتج','اللون','المقاس','المتاح','شراء','بيع',''],P.map(p=>[esc(p.n),esc(p.c),esc(p.s),`<b class="${p.q<=(p.min??3)?'no':''}">${p.q}${p.q<=(p.min??3)?' (منخفض)':''}</b>`,N(p.b),N(p.p),can('admin','stock')?`<button class="b s" onclick="pform('${p.id}')">تعديل</button> <button class="b s" onclick="mform('${p.id}')">حركة / جرد</button>`:'']));
function pform(id){const p=P.find(x=>x.id==id)||{},f=(i,l,v,t='text')=>`<div><label>${l}</label><input id="${i}" type="${t}" value="${esc(v)}"></div>`;modal(`<h3>${id?'تعديل':'منتج جديد'}</h3><div class="g">${f('pn','الاسم',p.n)}${f('pc','اللون',p.c)}${f('ps','المقاس',p.s)}${id?'':f('pq','الكمية الأولية',0,'number')}${f('pb','سعر الشراء',p.b||0,'number')}${f('pp','سعر البيع',p.p||0,'number')}${f('pm','حد إعادة الطلب',p.min??3,'number')}</div><p><button class="b" onclick="psave('${id||''}')">حفظ</button> <button class="b s" onclick="closeM()">إغلاق</button></p>`)}
async function psave(id){const n=val('pn').trim(),d={n,c:val('pc'),s:val('ps'),b:+val('pb'),p:+val('pp'),min:+val('pm')||0};if(!n||d.b<0||d.p<0)return toast('بيانات غير صحيحة');
 try{if(id)await fs.doc('products/'+id).update(d);else{const q=Math.max(0,Math.trunc(+val('pq')||0),0),r=fs.collection('products').doc();await r.set({...d,q});if(q)await fs.collection('movements').add({t:Date.now(),v:n+' '+d.c+' '+d.s,pid:r.id,d:q,w:'رصيد افتتاحي',u:me.name})}aud('product','حفظ المنتج '+n);closeM();toast('تم الحفظ')}catch(e){toast('تعذر الحفظ: '+e.code)}}
function mform(id){const p=P.find(x=>x.id==id);modal(`<h3>${esc(p.n)} — المتاح الدفتري ${p.q}</h3><div class="g"><div><label>الكمية الفعلية بعد الجرد (تسوية)</label><input id="mq" type="number" value="${p.q}"></div><div><label>السبب</label><input id="mw" value="تسوية جرد"></div></div><p><button class="b" onclick="msave('${id}')">اعتماد التسوية</button> <button class="b s" onclick="closeM()">إغلاق</button></p>`)}
async function msave(id){const to=Math.trunc(+val('mq')),w=val('mw').trim();if(!(to>=0)||!w)return toast('أدخل كمية صحيحة وسببًا');
 try{await fs.runTransaction(async t=>{const r=fs.doc('products/'+id),s=await t.get(r),d=to-s.data().q;if(!d)throw Error('لا فرق');t.update(r,{q:to});t.set(fs.collection('movements').doc(),{t:Date.now(),v:s.data().n+' '+(s.data().c||'')+' '+(s.data().s||''),pid:id,d,w,u:me.name})});aud('stock','تسوية جرد '+id);closeM();toast('تم اعتماد التسوية')}catch(e){toast(e.message||e.code)}}
V.users=()=>`<h2>المستخدمون والصلاحيات</h2><button class="b" onclick="uform()">+ مستخدم</button>`+tb(['الاسم','الإيميل','الدور','الحالة',''],U.map(u=>[esc(u.name),esc(u.email),ROLES[u.role]||u.role,u.active?'مفعّل':'معطّل',u.id==me.uid?'':`<button class="b s" onclick="utog('${u.id}',${!u.active})">${u.active?'تعطيل':'تفعيل'}</button>`]));
function uform(){modal(`<h3>مستخدم جديد</h3><div class="g"><div><label>الاسم</label><input id="un"></div><div><label>الإيميل</label><input id="ue" type="email"></div><div><label>كلمة سر مؤقتة (6+)</label><input id="up" type="password"></div><div><label>الدور</label><select id="ur">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><p><button class="b" onclick="usave()">إنشاء</button> <button class="b s" onclick="closeM()">إغلاق</button></p>`)}
async function usave(){const e=val('ue').trim(),p=val('up'),n=val('un').trim();if(!n||!e||p.length<6)return toast('بيانات ناقصة');let app2;try{app2=firebase.initializeApp(CFG,'s'+Date.now());const c=await app2.auth().createUserWithEmailAndPassword(e,p);await fs.doc('users/'+c.user.uid).set({name:n,email:e,role:val('ur'),active:true});await app2.auth().signOut();aud('user','إنشاء مستخدم '+e);closeM();toast('تم إنشاء المستخدم')}catch(x){toast('تعذر الإنشاء: '+x.code)}finally{if(app2)app2.delete()}}
async function utog(id,a){try{await fs.doc('users/'+id).update({active:a});aud('user',(a?'تفعيل ':'تعطيل ')+id)}catch(e){toast(e.code)}}

function xtra(o){let h='';
 if(can('admin','orders')&&rest(o)>0&&['مشحون','تم التسليم'].includes(o.st))h+=`<div class="box"><b>تسجيل تحصيل</b><div class="row"><input id="ca" type="number" min="1" max="${rest(o)}" value="${rest(o)}"><input id="cm" placeholder="طريقة التحصيل (نقدي/محفظة/شركة شحن)"><button class="b" onclick="collect('${o.id}')">تسجيل</button></div></div>`;
 if(o.st=='مرتجع'&&!o.rinsp&&can('admin','orders','stock'))h+=`<div class="box"><b>فحص المرتجع (المنتج مش هيرجع للمخزون قبل الاعتماد)</b><div class="g"><div><label>الحالة</label><select id="ic"><option>صالح للبيع</option><option>تالف</option></select></div><div><label>المبلغ المسترد للعميل (حتى ${N(o.paid)})</label><input id="ir" type="number" value="0"></div><div><label>تكلفة شحن المرتجع</label><input id="is" type="number" value="0"></div></div><p><button class="b" onclick="inspect('${o.id}')">اعتماد الفحص</button></p></div>`;
 if(o.rinsp)h+=`<p>فحص المرتجع: ${o.rinsp.c} — استرداد ${N(o.rinsp.rf)} — شحن مرتجع ${N(o.rinsp.rs)} — ${esc(o.rinsp.u)}</p>`;
 return h}
async function collect(id){if(busy)return;const a=+val('ca'),m=val('cm').trim();if(!(a>0)||!m)return toast('أدخل مبلغًا وطريقة التحصيل');busy=1;
 try{await fs.runTransaction(async t=>{const r=fs.doc('orders/'+id),s=await t.get(r),o=s.data();if(a>rest(o))throw Error('المبلغ أكبر من المتبقي ('+N(rest(o))+')');const n=o.ncol||0;
  t.update(r,{paid:(+o.paid||0)+a,ncol:n+1,ver:o.ver+1,upd:TS(),hist:[...o.hist,{t:Date.now(),u:me.name,f:o.st,to:o.st,r:'تحصيل '+a,ch:['paid']}]});
  t.set(fs.doc('money/col_'+id+'_'+n),{t:Date.now(),k:'in',cat:'تحصيل طلب',amt:a,method:m,ref:id,no:o.no,note:'',u:me.name,void:false})});aud('money','تحصيل '+a+' طلب '+id);closeM();toast('تم تسجيل التحصيل')}catch(e){toast(e.message||e.code)}busy=0}
async function inspect(id){if(busy)return;const c=val('ic'),rf=+val('ir')||0,rs=+val('is')||0;if(rf<0||rs<0)return toast('قيم غير صحيحة');busy=1;
 try{await fs.runTransaction(async t=>{const r=fs.doc('orders/'+id),s=await t.get(r),o=s.data();if(o.rinsp)throw Error('المرتجع اتفحص قبل كده');if(o.st!='مرتجع')throw Error('الطلب ليس مرتجعًا');if(rf>(+o.paid||0))throw Error('الاسترداد أكبر من المحصل');
  const d={},ps={};if(c=='صالح للبيع'){o.items.forEach(i=>d[i.v]=(d[i.v]||0)+i.q);for(const k in d)ps[k]=(await t.get(fs.doc('products/'+k))).data()}
  for(const k in d){t.update(fs.doc('products/'+k),{q:ps[k].q+d[k]});t.set(fs.collection('movements').doc(),{t:Date.now(),v:ps[k].n+' '+(ps[k].c||'')+' '+(ps[k].s||''),pid:k,d:d[k],w:'مرتجع صالح #'+o.no,u:me.name})}
  if(rf>0)t.set(fs.doc('money/ref_'+id),{t:Date.now(),k:'out',cat:'استرداد مرتجع',amt:rf,method:'',ref:id,no:o.no,note:'',u:me.name,void:false});
  t.update(r,{rinsp:{c,rf,rs,t:Date.now(),u:me.name},ver:o.ver+1,upd:TS(),hist:[...o.hist,{t:Date.now(),u:me.name,f:'مرتجع',to:'مرتجع',r:'فحص: '+c,ch:['rinsp']}]})});aud('return','فحص مرتجع '+id+' '+c);closeM();toast('تم اعتماد الفحص')}catch(e){toast(e.message||e.code)}busy=0}
V.fin=()=>{const f=F.f?new Date(F.f).getTime():0,t2=F.t?new Date(F.t).getTime()+864e5-1:9e15,r=pnl(O,M,f,t2),open=sum(O.filter(o=>!['ملغي','مرتجع','تم التسليم'].includes(o.st)),total),
 card=(a,b,x)=>`<div class="box"><small>${a}</small><br><b style="font-size:20px">${N(b)}</b>${x?`<br><small>${x}</small>`:''}</div>`;
 return `<h2>المالية والخزينة</h2><div class="row"><label>من</label><input type="date" value="${F.f}" onchange="F.f=this.value;draw()"><label>إلى</label><input type="date" value="${F.t}" onchange="F.t=this.value;draw()"></div>
 <div class="g">${card('رصيد الخزينة (كل الفترات)',r.bal,'مقبوضات − مدفوعات فعلية')}${card('مقبوضات الفترة',r.cin)}${card('مدفوعات الفترة',r.cout)}${card('قيمة طلبات مفتوحة (غير محصلة)',open,'ليست مبيعات ولا تحصيل')}</div>
 <div class="box"><h3>الأرباح (تقديري)</h3><div class="g">${card('المبيعات المعترف بها',r.sales,'طلبات «تم التسليم» بتاريخ التسليم')}${card('تكلفة البضاعة',r.cogs,'سعر الشراء وقت الطلب')}${card('الربح الإجمالي',r.gp)}${card('شحن على الشركة',r.ship,'تسليم + مرتجع')}${card('مصروفات التشغيل',r.opex,'بدون شراء بضاعة/سحب/استرداد')}${card('إيرادات أخرى',r.oth)}${card('صافي الربح التشغيلي',r.net,'تقديري: التكلفة مش متوسط مرجح')}</div><small>التحصيل ورأس المال لا يدخلان الأرباح. لا تسجّل شحن الطلبات كمصروف يدوي لأنه محسوب من الطلبات.</small></div>
 ${can('admin','accountant')?`<div class="box"><h3>قيد يدوي</h3><div class="g"><div><label>البند</label><select id="fc"><optgroup label="وارد">${IN_C.map(c=>`<option data-k="in">${c}</option>`).join('')}</optgroup><optgroup label="صادر">${OUT_C.map(c=>`<option data-k="out">${c}</option>`).join('')}</optgroup></select></div><div><label>المبلغ</label><input id="fa" type="number" min="1"></div><div><label>طريقة الدفع</label><input id="fm"></div><div><label>ملاحظة</label><input id="fn"></div></div><p><button class="b" onclick="fadd()">تسجيل</button></p></div>`:''}`+
 tb(['التاريخ','النوع','البند','المبلغ','الطريقة','طلب','ملاحظة','المستخدم','الحالة',''],M.map(m=>[D(m.t),m.k=='in'?'وارد':'صادر',m.cat,N(m.amt),esc(m.method),m.no||'',esc(m.note),esc(m.u),m.void?'ملغى: '+esc(m.voidWhy):'ساري',(!m.void&&!m.ref)?`<button class="b d" onclick="fvoid('${m.id}')">إلغاء</button>`:'']))};
async function fadd(){const o=$('#fc').selectedOptions[0],a=+val('fa');if(!(a>0))return toast('أدخل مبلغًا صحيحًا');try{await fs.collection('money').add({t:Date.now(),k:o.dataset.k,cat:o.value,amt:a,method:val('fm'),ref:'',note:val('fn'),u:me.name,void:false});aud('money','قيد '+o.value+' '+a);toast('تم التسجيل')}catch(e){toast('تعذر الحفظ: '+e.code)}}
function fvoid(id){modal(`<h3>إلغاء القيد</h3><p>القيد هيفضل ظاهر في السجل ومش هيدخل في الحسابات.</p><input id="vw" placeholder="السبب (إلزامي)" style="width:100%"><p><button class="b d" onclick="fvoid2('${id}')">إلغاء القيد</button> <button class="b s" onclick="closeM()">رجوع</button></p>`)}
async function fvoid2(id){const w=val('vw').trim();if(!w)return toast('اكتب السبب');try{await fs.doc('money/'+id).update({void:true,voidBy:me.name,voidWhy:w});aud('money','إلغاء قيد '+id+': '+w);closeM()}catch(e){toast(e.code)}}
V.audit=()=>`<h2>سجل النشاط</h2>`+tb(['الوقت','المستخدم','النوع','الإجراء'],A.map(a=>[D(a.t),esc(a.u),a.type,esc(a.act)]));
V.test=()=>{const r=[],ok=(n,c)=>r.push([n,c?'<b class="ok">نجح</b>':'<b class="no">فشل</b>']),ps={a:{n:'x',q:5}},mk=(q,st,sk)=>({st,sk,items:[{v:'a',q,p:200}],disc:0,fee:0,paid:0});
 let p=plan(null,mk(2,'مؤكد'),ps);ok('التأكيد يخصم 2',p.d.a==-2&&p.sk);const o1=mk(2,'مؤكد',true);p=plan(o1,mk(3,'مؤكد'),ps);ok('رفع الكمية 2→3 يخصم 1 فقط',p.d.a==-1);
 p=plan(o1,mk(2,'مشحون'),ps);ok('مؤكد→مشحون بلا خصم مزدوج',!p.d.a);p=plan(o1,mk(2,'ملغي'),ps);ok('الإلغاء يعيد 2',p.d.a==2&&!p.sk);
 p=plan(mk(2,'تم التسليم',true),mk(2,'مرتجع'),ps);ok('المرتجع لا يعيد المخزون قبل الفحص',!p.d.a&&p.sk);ok('منع البيع بأكثر من المتاح',!!plan(null,mk(9,'مؤكد'),ps).err);
 const o={items:[{q:2,p:200},{q:1,p:100}],disc:50,fee:30,paid:100};ok('الإجمالي = 500−50+30 = 480',total(o)==480);ok('المتبقي = 480−100 = 380',rest(o)==380);
 return `<h2>اختبار الحسابات (دوال نقية فقط)</h2><p>لا يختبر هذا الاتصال بـ Firebase أو القواعد؛ دي تُختبر يدويًا (راجع قائمة التسليم).</p>`+tb(['الاختبار','النتيجة'],r)};
draw();
</script></body></html>
